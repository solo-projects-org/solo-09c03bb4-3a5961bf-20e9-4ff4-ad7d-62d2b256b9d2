services:
  orchestrator:                # 诊断网页 + 流程编排(取数→并行质控→入仓)
    build: ./app
    ports:
      - "8000:8000"
    environment:
      SOURCE_URL: http://source:8000
      QC_URL: http://qc:8000
      DB_PATH: /data/orch.db
    volumes:
      - orch-data:/data          # SQLite 持久化：容器重启后据此接续未定稿批次
    depends_on:
      source:
        condition: service_healthy
      qc:
        condition: service_healthy

  source:                      # 独立检验源：返回样品号+浓度；名额槽位/延迟/首次失败可调
    build: ./source_app
    ports:
      - "8001:8000"            # 暴露便于单独排查，网页操作只需 8000
    environment:
      ORCH_URL: http://orchestrator:8000
      SOURCE_DELAY_MS: "300"
      SOURCE_SLOTS: "3"
      SOURCE_FAIL_FIRST: "0"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 3s

  qc:                          # 质控服务：①非负值 ②样品号对应，两项独立调延迟/首次失败
    build: ./qc_app
    ports:
      - "8002:8000"
    environment:
      ORCH_URL: http://orchestrator:8000
      QC_NONNEG_DELAY_MS: "200"
      QC_MATCH_DELAY_MS: "200"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 3s

volumes:
  orch-data:
